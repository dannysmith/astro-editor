[package]
name = "astro-editor"
version = "1.0.20"
description = "A markdown editor for Astro content collections"
authors = ["Danny Smith"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "astro_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }

# Type-safe Tauri commands with auto-generated TypeScript bindings
specta = { version = "=2.0.0-rc.26", features = ["indexmap", "serde_json"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
tokio = { version = "1", features = ["full"] }
notify = "=9.0.0-rc.6"
walkdir = "2"
rfd = "0.17"
regex = "1.10"
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-fs = "2.4.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-process = "2.3.0"
tauri-plugin-log = "2.0.0"
log = "0.4"
chrono = "0.4"
swc_common = "26"
swc_ecma_ast = "29"
swc_ecma_parser = "45"
swc_ecma_visit = "29"
indexmap = { version = "2", features = ["serde"] }
pathdiff = "0.2"
reqwest = { version = "0.13", features = ["json"] }
uuid = { version = "1.23", features = ["v4"] }
tauri-plugin-os = "2.3.2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# HTTP server for the debug-only agent bridge (src/agent_bridge)
tiny_http = "0.12"

# Native WKWebView snapshots for the agent bridge
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "WKWebView",
  "WKSnapshotConfiguration",
] }

[dev-dependencies]
tempfile = "3.27"
toml = "1.1.8"

# Desktop-only dependencies (excludes Android and iOS)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1 # Better LLVM optimization
lto = true # Link-time optimizations
opt-level = "s" # Prioritize small binary size
panic = "abort" # Disable panic handlers
strip = true # Remove debug symbols
