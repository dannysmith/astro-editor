<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Astro Editor — Marketing Video</title>
    <!--
      The Astro Editor marketing video, authored as a web page. One blog post
      goes from a blank page to a pushed commit.

      Every frame is a pure function of time: render(t) sets all DOM state for
      t seconds in. There are no CSS transitions or animations, so render.mjs
      can seek to any frame and screenshot it deterministically.

      Open with ?play to watch it in real time, ?t=12.5 to inspect one frame,
      or add ?clip=copyedit or ?clip=git for a square social clip.
      See README.md for the full pipeline.
    -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <div id="bg"></div>
      <div id="scenes"></div>
      <div id="grain"></div>
      <div id="vignette"></div>
      <div id="blackout"></div>
    </div>

    <script src="timeline.js"></script>
    <script src="helpers.js"></script>
    <script src="chapters/why.js"></script>
    <script src="chapters/schema.js"></script>
    <script src="chapters/app.js"></script>
    <script src="chapters/write.js"></script>
    <script src="chapters/link.js"></script>
    <script src="chapters/edit.js"></script>
    <script src="chapters/commit.js"></script>
    <script src="chapters/end.js"></script>
    <script src="main.js"></script>
  </body>
</html>
