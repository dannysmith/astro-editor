name: CI Build Check

# Runs on every push to a PR while it has the `ci` label, and on pushes to main.
# Only main saves the Rust cache; PRs restore it (PRs can't read each other's caches).
on:
  pull_request:
    types: [labeled, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '*.md'
  workflow_dispatch:

jobs:
  checks:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ci'))
    # Job-level so a skipped run (e.g. another label added) can't cancel a real one
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}-checks
      cancel-in-progress: true
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # No debug info: faster test builds and a smaller cache. Failing tests still
    # report file:line, but backtraces lose line numbers.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Vitest still runs on Node
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check:all

  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ci'))
    # Job-level so a skipped run (e.g. another label added) can't cancel a real one
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}-${{ matrix.platform }}
      cancel-in-progress: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native arm64 only; release.yml builds the universal binary
          - platform: 'macos-15'
            args: '--bundles app'
          - platform: 'windows-latest'
            args: '--bundles msi'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb,rpm'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    # Skip LTO and allow parallel codegen to cut build time. Release builds keep
    # the Cargo.toml profile. Not `--debug`, which would compile dev-only code.
    env:
      CARGO_PROFILE_RELEASE_LTO: false
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The Tauri CLI still runs on Node
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Tauri build
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      # A build that compiles can still crash at startup, so launch it and fail if it
      # exits within 20s. GitHub sets CI=true, which skips startup telemetry.
      - name: Smoke test (app starts)
        if: matrix.platform == 'windows-latest'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/astro-editor.exe'
          if (-not (Test-Path $exe)) { throw "Built app not found at $exe" }
          $app = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardOutput smoke-stdout.log -RedirectStandardError smoke-stderr.log
          $null = $app.Handle # without this, ExitCode is empty after the process exits
          $exited = $app.WaitForExit(20000)
          if (-not $exited) { Stop-Process -Id $app.Id -Force; $app.WaitForExit() }
          Get-Content smoke-stdout.log, smoke-stderr.log -ErrorAction SilentlyContinue
          if ($exited) { throw "The app exited during startup with code $($app.ExitCode)" }
          Write-Output 'The app was still running after 20s'
