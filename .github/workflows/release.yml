name: 'Release Astro Editor'

# Builds a release from a version tag. A tag with a `-` in it is a test build
# (`v1.0.21-test.3`, made by `bun run test-build`): it gets its version set
# here rather than committed, and is published as a prerelease once every
# platform has built. Real releases are left as drafts to publish by hand.

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Create a single draft release up front so the parallel build matrix all
  # uploads to one shared release. Without this, each matrix job runs
  # find-or-create and a tauri-action race (issue #914: updateRelease strips the
  # tag off a draft, so a parallel job can't find it and creates a second draft)
  # can split assets across multiple drafts, each with an incomplete latest.json.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TEST_BUILD: ${{ contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7
        if: env.TEST_BUILD == 'true'

      # test-build writes the release's name and notes into the tag message.
      # checkout can leave an annotated tag lightweight, so fetch it explicitly
      - name: Read test build notes
        id: notes
        if: env.TEST_BUILD == 'true'
        run: |
          git fetch --depth=1 --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          {
            echo "name=$(git for-each-ref --format='%(contents:subject)' "refs/tags/$RELEASE_TAG")"
            echo 'body<<EOF_RELEASE_BODY'
            git for-each-ref --format='%(contents:body)' "refs/tags/$RELEASE_TAG"
            echo 'EOF_RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        env:
          TEST_BUILD_NAME: ${{ steps.notes.outputs.name }}
          TEST_BUILD_BODY: ${{ steps.notes.outputs.body }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG
            const testBuild = process.env.TEST_BUILD === 'true'
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: testBuild ? process.env.TEST_BUILD_NAME : `Astro Editor ${tag}`,
              body: testBuild ? process.env.TEST_BUILD_BODY : `## Astro Editor ${tag}\n`,
              draft: true,
              prerelease: testBuild,
            })
            return data.id

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15'
            args: '--target universal-apple-darwin --bundles app,dmg'
          - platform: 'windows-latest'
            args: '--bundles msi'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb,rpm'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Vitest and the Tauri CLI still run on Node
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      # No Rust cache: releases build cold. They can't restore ci.yml's cache
      # (different job id, env vars and LTO profile), and tag-scoped caches
      # are never read again.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Test builds aren't committed with their version, so set it here. Runs
      # after the install because it changes package.json
      - name: Set test build version
        if: contains(github.ref_name, '-')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/release-version.js "$RELEASE_TAG"

      - name: Install Rust targets for universal binary
        if: matrix.platform == 'macos-15'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Import Code-Signing Certificates
        if: matrix.platform == 'macos-15'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Create API Key file
        if: matrix.platform == 'macos-15'
        run: |
          # Create directory for API key
          mkdir -p ~/private_keys

          # Create API key file with proper content and permissions
          echo "${{ secrets.APPLE_API_KEY_PATH }}" > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8

      - name: Build and release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          # Tauri updater signing (works for all platforms)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing (macOS only - ignored on other platforms)
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Daniel Smith (XT349SJG9U)'
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Upload to the shared draft from the create-release job instead of
          # finding-or-creating per matrix job (avoids tauri-action #914). The
          # release name/body and draft state are set by create-release.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  # Publish stable-named copies of each installer plus a SHA256SUMS file to the
  # draft release. The website links to these stable URLs
  # (/releases/latest/download/astro-editor-latest.*), so we never commit
  # installers to the repo. tauri-action names assets with the version, so we
  # add fixed-name copies here. Test builds skip it: /releases/latest never
  # points at a prerelease.
  publish-stable-assets:
    needs: publish-tauri
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release installers
        run: |
          mkdir -p /tmp/release
          gh release download "$RELEASE_TAG" \
            --pattern '*.dmg' \
            --pattern '*.msi' \
            --pattern '*.AppImage' \
            --pattern '*.deb' \
            --pattern '*.rpm' \
            --dir /tmp/release
          echo "Downloaded:"
          ls -la /tmp/release

      - name: Create stable-named copies
        working-directory: /tmp/release
        run: |
          copy_stable() {
            local pattern="$1" dest="$2" match
            match=$(ls $pattern 2>/dev/null | head -1)
            if [ -z "$match" ]; then
              echo "::error::No file matched $pattern for $RELEASE_TAG"
              exit 1
            fi
            cp "$match" "$dest"
            echo "Stable copy: $match -> $dest"
          }
          copy_stable '*.dmg' astro-editor-latest.dmg
          copy_stable '*.msi' astro-editor-latest.msi
          copy_stable '*.AppImage' astro-editor-latest.AppImage
          copy_stable '*.deb' astro-editor-latest.deb
          copy_stable '*.rpm' astro-editor-latest.rpm

      - name: Generate SHA256SUMS
        working-directory: /tmp/release
        run: |
          shopt -s nullglob
          # Covers both versioned assets (Releases page) and stable copies
          # (website downloads), so `sha256sum -c` works for either source.
          installers=( *.dmg *.msi *.AppImage *.deb *.rpm )
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::No installers found for $RELEASE_TAG"
            exit 1
          fi
          sha256sum "${installers[@]}" > SHA256SUMS
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Upload stable assets to release
        working-directory: /tmp/release
        run: |
          shopt -s nullglob
          to_upload=( astro-editor-latest.* SHA256SUMS )
          gh release upload "$RELEASE_TAG" --clobber "${to_upload[@]}"
          echo "Uploaded: ${to_upload[*]}"

  # Publish a test build as a prerelease once every platform has uploaded, so
  # testers can download it. If any build failed this never runs and the draft
  # stays hidden. The release is addressed by id and its tag set again, because
  # tauri-action can strip the tag off a draft (tauri-action#914).
  publish-test-build:
    needs: [create-release, publish-tauri]
    if: contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Publish prerelease
        run: |
          gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -f tag_name="$RELEASE_TAG" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false \
            --jq .html_url
