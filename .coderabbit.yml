# CodeRabbit Configuration
# https://docs.coderabbit.ai/reference/configuration

reviews:
  collapse_walkthrough: true
  sequence_diagrams: false
  path_filters:
    - '!**/*.md'
    - '!test/**'
    - '!website/src/content/**'
    - '!src/styleguide/**'
    - '!bun.lock'
    - '!src/lib/bindings.ts'

issue_enrichment:
  auto_enrich:
    enabled: false
