# CodeRabbit Configuration
# https://docs.coderabbit.ai/reference/configuration

reviews:
  collapse_walkthrough: true
  sequence_diagrams: false
  path_filters:
    - '!**/*.md'
    - '!test/**'
    - '!website/src/content/**'
    - '!src/styleguide/**'
    - '!bun.lock'
    - '!src-tauri/Cargo.lock'
    - '!src/lib/bindings.ts'
    - '!**/*.png'
    # Frontend tests, to stay under its 150-file limit on big branches. Rust
    # tests are inline, so they're still reviewed.
    - '!**/*.test.ts'
    - '!**/*.test.tsx'
    - '!**/__tests__/**'

issue_enrichment:
  auto_enrich:
    enabled: false
